  <rect x="4.5" y="6" width="4" height="4" rx="1" fill="#4B5563"/>
  <rect x="4.5" y="12" width="4" height="4" rx="1" fill="#4B5563"/>

  <!-- Column 2: 1 blue card -->
  <rect x="12.5" y="4" width="7" height="24" rx="2" fill="#1F2937"/>
